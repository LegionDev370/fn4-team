<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalkulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 255, 180, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 180, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 8s linear infinite;
      pointer-events: none;
    }

    @keyframes gridMove {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    /* Glow orbs */
    body::after {
      content: '';
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0,255,180,0.08) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      pointer-events: none;
      animation: orbFloat 6s ease-in-out infinite alternate;
    }

    @keyframes orbFloat {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(80px, 80px); }
    }

    .calculator {
      position: relative;
      background: #111;
      border: 1px solid rgba(0, 255, 180, 0.3);
      border-radius: 4px;
      padding: 24px;
      width: 320px;
      box-shadow:
        0 0 0 1px rgba(0,255,180,0.1),
        0 0 40px rgba(0, 255, 180, 0.08),
        inset 0 0 60px rgba(0, 0, 0, 0.5);
    }

    /* Corner decorations */
    .calculator::before,
    .calculator::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: #00ffb4;
      border-style: solid;
    }
    .calculator::before {
      top: -1px; left: -1px;
      border-width: 2px 0 0 2px;
    }
    .calculator::after {
      bottom: -1px; right: -1px;
      border-width: 0 2px 2px 0;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #00ffb4;
      text-transform: uppercase;
    }

    .dots {
      display: flex;
      gap: 5px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .dot-r { background: #ff4757; box-shadow: 0 0 6px #ff4757; }
    .dot-y { background: #ffa502; box-shadow: 0 0 6px #ffa502; }
    .dot-g { background: #00ffb4; box-shadow: 0 0 6px #00ffb4; }

    /* Display */
    .display {
      background: #0a0a0a;
      border: 1px solid rgba(0, 255, 180, 0.2);
      border-radius: 2px;
      padding: 16px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .display::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #00ffb4, transparent);
      opacity: 0.5;
    }

    .expression {
      font-size: 11px;
      color: rgba(0, 255, 180, 0.4);
      min-height: 18px;
      text-align: right;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .result {
      font-family: 'Orbitron', sans-serif;
      font-size: 36px;
      font-weight: 400;
      color: #00ffb4;
      text-align: right;
      text-shadow: 0 0 20px rgba(0, 255, 180, 0.6);
      word-break: break-all;
      line-height: 1.1;
      transition: text-shadow 0.2s;
    }

    /* Scan line effect */
    .display::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.05) 2px,
        rgba(0,0,0,0.05) 4px
      );
      pointer-events: none;
    }

    /* Buttons grid */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 2px;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      height: 60px;
      cursor: pointer;
      transition: all 0.1s ease;
      outline: none;
      position: relative;
      letter-spacing: 1px;
    }

    /* Number */
    .btn-num {
      background: #161616;
      color: #e0e0e0;
      border: 1px solid #2a2a2a;
    }
    .btn-num:hover {
      background: #1e1e1e;
      border-color: rgba(0, 255, 180, 0.4);
      color: #00ffb4;
      box-shadow: 0 0 12px rgba(0,255,180,0.1);
    }
    .btn-num:active {
      background: rgba(0,255,180,0.08);
      transform: scale(0.95);
    }

    /* Operator */
    .btn-op {
      background: #0d1f1a;
      color: #00ffb4;
      border: 1px solid rgba(0,255,180,0.3);
      text-shadow: 0 0 8px rgba(0,255,180,0.5);
    }
    .btn-op:hover {
      background: rgba(0,255,180,0.12);
      border-color: #00ffb4;
      box-shadow: 0 0 16px rgba(0,255,180,0.2), inset 0 0 10px rgba(0,255,180,0.05);
    }
    .btn-op:active {
      transform: scale(0.95);
      background: rgba(0,255,180,0.2);
    }

    /* Equals */
    .btn-eq {
      background: #00ffb4;
      color: #0a0a0a;
      border: none;
      font-weight: 900;
      box-shadow: 0 0 20px rgba(0,255,180,0.4);
    }
    .btn-eq:hover {
      background: #33ffc4;
      box-shadow: 0 0 30px rgba(0,255,180,0.7);
    }
    .btn-eq:active {
      transform: scale(0.95);
      box-shadow: 0 0 10px rgba(0,255,180,0.3);
    }

    /* Clear */
    .btn-clear {
      background: #1a0d0d;
      color: #ff4757;
      border: 1px solid rgba(255,71,87,0.3);
      text-shadow: 0 0 8px rgba(255,71,87,0.5);
    }
    .btn-clear:hover {
      background: rgba(255,71,87,0.12);
      border-color: #ff4757;
      box-shadow: 0 0 16px rgba(255,71,87,0.2);
    }
    .btn-clear:active {
      transform: scale(0.95);
    }

    /* Delete */
    .btn-del {
      background: #1a0d0d;
      color: #ff6b81;
      border: 1px solid rgba(255,71,87,0.2);
      font-size: 18px;
    }
    .btn-del:hover {
      background: rgba(255,71,87,0.1);
      border-color: rgba(255,71,87,0.5);
    }
    .btn-del:active {
      transform: scale(0.95);
    }

    /* Percent */
    .btn-pct {
      background: #0f0f1a;
      color: #a78bfa;
      border: 1px solid rgba(167,139,250,0.2);
    }
    .btn-pct:hover {
      background: rgba(167,139,250,0.1);
      border-color: rgba(167,139,250,0.5);
      box-shadow: 0 0 12px rgba(167,139,250,0.15);
    }
    .btn-pct:active {
      transform: scale(0.95);
    }

    .span-two {
      grid-column: span 2;
    }

    /* Flicker animation on result */
    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.8; }
      97% { opacity: 1; }
      98% { opacity: 0.9; }
    }
    .result {
      animation: flicker 5s infinite;
    }
  </style>
</head>
<body>

<div class="calculator">
  <div class="header">
    <span class="title">CALC_v2.0</span>
    <div class="dots">
      <span class="dot dot-r"></span>
      <span class="dot dot-y"></span>
      <span class="dot dot-g"></span>
    </div>
  </div>

  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="buttons">
    <button class="btn-clear" onclick="clearAll()">AC</button>
    <button class="btn-del"   onclick="deleteLast()">⌫</button>
    <button class="btn-pct"   onclick="appendValue('%')">%</button>
    <button class="btn-op"    onclick="appendValue('/')">÷</button>

    <button class="btn-num" onclick="appendValue('7')">7</button>
    <button class="btn-num" onclick="appendValue('8')">8</button>
    <button class="btn-num" onclick="appendValue('9')">9</button>
    <button class="btn-op"  onclick="appendValue('*')">×</button>

    <button class="btn-num" onclick="appendValue('4')">4</button>
    <button class="btn-num" onclick="appendValue('5')">5</button>
    <button class="btn-num" onclick="appendValue('6')">6</button>
    <button class="btn-op"  onclick="appendValue('-')">−</button>

    <button class="btn-num" onclick="appendValue('1')">1</button>
    <button class="btn-num" onclick="appendValue('2')">2</button>
    <button class="btn-num" onclick="appendValue('3')">3</button>
    <button class="btn-op"  onclick="appendValue('+')">+</button>

    <button class="btn-num span-two" onclick="appendValue('0')">0</button>
    <button class="btn-num"          onclick="appendValue('.')">.</button>
    <button class="btn-eq"           onclick="calculate()">=</button>
  </div>
</div>

<script src="app1.js"></script>
</body>
</html>
